# render.yaml — Configuration de déploiement Render pour PAP-LFI
services:
  - type: web
    name: pap-lfi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      # ⚠️ À renseigner dans le Dashboard Render (Service → Environment)
      # - key: SUPABASE_URL
      #   value: https://VOTRE-PROJET.supabase.co
      # - key: SUPABASE_ANON_KEY
      #   value: votre-clé-anon
      # - key: APP_SECRET
      #   value: secret-serveur-pour-les-liens (généré aléatoirement)
